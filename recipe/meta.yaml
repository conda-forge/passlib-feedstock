{% set name = "passlib" %}
{% set version = "1.9.5" %}
{% set bundle = "tar.gz" %}
{% set hash = "15d39a9b2044a86f341a2e443170e4e9a6d71fe0266fe28b91032a8ca723f8aa" %}
{% set build = 0 %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ bundle }}
  sha256: {{ hash }}

build:
  noarch: python
  number: {{ build }}
  script: {{ PYTHON }} setup.py install --single-version-externally-managed --record=record.txt

requirements:
  host:
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}
    - argon2-cffi >=19.2.0
    - bcrypt >=3.1.0
    - cryptography

test:
  requires:
    - python {{ python_min }}
  imports:
    - passlib
    - passlib._setup
    - passlib.crypto
    - passlib.crypto._blowfish
    - passlib.crypto.scrypt
    - passlib.ext
    - passlib.ext.django
    - passlib.handlers
    - passlib.tests
    - passlib.utils
    - passlib.utils.compat

about:
  home: https://bitbucket.org/ecollins/passlib
  license_file: LICENSE
  license: BSD-3-Clause
  license_family: BSD
  summary: comprehensive password hashing framework supporting over 30 schemes
  dev_url: https://bitbucket.org/ecollins/passlib/src
  doc_url: https://bitbucket.org/ecollins/passlib/wiki/Home

extra:
  recipe-maintainers:
    - pmlandwehr
    - xhochy
